; 第一个固件：点灯。
; 板子型号明天确认后改 [env] 名 / board。常见几种都列在下面，注释掉不用的。
;
; 编译：  pio run
; 烧录：  pio run -t upload
; 串口：  pio device monitor

[platformio]
default_envs = bluepill

; ---- STM32F103C8T6 "Blue Pill"（最常见的入门套件）+ ST-Link V2 ----
[env:bluepill]
platform = ststm32
board = bluepill_f103c8
framework = arduino
upload_protocol = stlink
monitor_speed = 115200
build_flags = -D LED_PIN=PC13   ; 蓝药丸板载 LED 在 PC13，低电平亮

; ---- Nucleo-F103RB（官方开发板，自带 ST-Link，直接 USB）----
[env:nucleo_f103rb]
platform = ststm32
board = nucleo_f103rb
framework = arduino
monitor_speed = 115200
build_flags = -D LED_PIN=PA5

; ---- Nucleo-F411RE / F401RE ----
[env:nucleo_f411re]
platform = ststm32
board = nucleo_f411re
framework = arduino
monitor_speed = 115200
build_flags = -D LED_PIN=PA5

; ---- STM32F407 系列大板（正点原子/野火等国产套件，板载 LED 引脚看板子标注）----
[env:f407]
platform = ststm32
board = genericSTM32F407VET6
framework = arduino
upload_protocol = stlink
monitor_speed = 115200
build_flags = -D LED_PIN=PF9
